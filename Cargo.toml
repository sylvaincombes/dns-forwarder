[package]
name = "dns-forwarder"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Minimal UDP DNS forwarder for socktainer inter-container DNS"
license = "Apache-2.0"
repository = "https://github.com/socktainer/dns-forwarder"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "forward"
harness = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
